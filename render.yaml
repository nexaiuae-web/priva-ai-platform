# Render Blueprint — Web Service for PRIVA-AI API
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: priva-ai-api
    runtime: node
    plan: free
    # Do not override PATH in Render env without appending ($PATH) — breaks /home/render/colors.sh (tput).
    buildCommand: npm install --legacy-peer-deps --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RENDER
        value: "true"
      - key: VECTOR_STORE
        value: mongo
      - key: TENANT_STORE
        value: mongo
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: DEFAULT_MONTHLY_QUESTION_LIMIT
        value: "500"
      - key: LLM_MAX_CONCURRENT
        value: "5"
      - key: DISABLE_OPENCOLLECTIVE
        value: "1"
      - key: CI
        value: "true"
      # Set in Render dashboard (never commit secrets):
      # MONGODB_URI, JWT_SECRET, OPENAI_API_KEY, CORS_ORIGIN,
      # PRIVA_CLOUDINARY_CLOUD_NAME, PRIVA_CLOUDINARY_API_KEY, PRIVA_CLOUDINARY_API_SECRET, etc.
